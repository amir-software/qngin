# Publish to PyPI when a version tag is pushed (e.g. v0.1.0).
#
# One-time setup on PyPI:
#   1. Create the project (first manual upload) or claim the name.
#   2. Project settings → Publishing → Add a trusted publisher:
#        Owner: <your-github-user-or-org>
#        Repository: qngin
#        Workflow: publish.yml
#        Environment: pypi   (optional but recommended)
#
# Then: bump version in pyproject.toml + src/qngin/__init__.py, commit,
# tag, and push:
#   git tag v0.1.0 && git push origin v0.1.0

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qngin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
