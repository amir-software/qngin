[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qngin"
version = "0.1.0"
description = "Framework-agnostic query engine: metadata flows to SQL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qngin contributors" }]
keywords = [
    "sql",
    "query-engine",
    "query-builder",
    "postgres",
    "postgresql",
    "clickhouse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.2",
    "twine>=5.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/qngin",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/amir-software/qngin"
Repository = "https://github.com/amir-software/qngin"
Issues = "https://github.com/amir-software/qngin/issues"
Changelog = "https://github.com/amir-software/qngin/blob/main/CHANGELOG.md"
